<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Chat with Task</title>
  <link rel="stylesheet" href="/css/studio.css" />
  <link rel="icon" href="/scale-icon.svg" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card glass" id="login-form">
      <h1>Chat with Task</h1>
      <div class="sub">ACC audit studio — sign in to continue</div>
      <input type="text" id="username" placeholder="username" autocomplete="username" autofocus />
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="password" autocomplete="current-password" />
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" title="Show password">
          <svg class="on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <button class="primary" type="submit">Sign in</button>
      <div class="login-error" id="error"></div>
    </form>
  </div>
  <script type="module">
    import { api } from '/js/common.js';
    const pw = document.getElementById('password');
    const toggle = document.getElementById('pw-toggle');
    toggle.addEventListener('click', () => {
      const reveal = pw.type === 'password';
      pw.type = reveal ? 'text' : 'password';
      toggle.classList.toggle('revealed', reveal);
      const label = reveal ? 'Hide password' : 'Show password';
      toggle.title = label;
      toggle.setAttribute('aria-label', label);
      pw.focus();
    });
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      try {
        await api('/login', {
          method: 'POST',
          body: {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          },
        });
        location.href = '/';
      } catch (err) {
        error.textContent = err.message;
      }
    });
  </script>
</body>
</html>
