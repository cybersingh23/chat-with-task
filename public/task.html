<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task — Chat with Task</title>
  <link rel="stylesheet" href="/css/studio.css" />
  <link rel="icon" href="/scale-icon.svg" />
</head>
<body>
  <header class="topbar">
    <a href="/" style="text-decoration:none;color:inherit"><div class="app-name">Chat with Task</div></a>
    <span class="chip" id="bucket-chip"></span>
    <span class="mono" id="task-id" style="font-size:12px;color:var(--text-dim)"></span>
    <div class="spacer"></div>
    <div class="claim-bar">
      <span class="chip claimed" id="claim-chip" hidden></span>
      <button id="claim-btn" hidden>Claim task</button>
      <select class="verdict-select" id="verdict-select" title="reviewer decision">
        <option value="">decision…</option>
        <option value="NO_ISSUES">No Issues</option>
        <option value="FIXES_MADE">Fixes made</option>
        <option value="SBQ">SBQ</option>
        <option value="SECOND_OPINION">Second Opinion Needed</option>
        <option value="__clear">— clear decision</option>
      </select>
      <select id="move-select" title="move between buckets">
        <option value="">move to…</option>
        <option value="HARD_FAIL">HARD_FAIL</option>
        <option value="SOFT_FAIL">SOFT_FAIL</option>
        <option value="PASS">PASS</option>
        <option value="UNSORTED">UNSORTED</option>
      </select>
    </div>
    <div class="user-chip" id="user-chip" hidden>
      <span id="user-name"></span>
      <button id="logout-btn">sign out</button>
    </div>
  </header>

  <div class="task-layout">
    <nav class="sidebar glass" id="sidebar">
      <h3>Documents</h3>
      <div id="nav-docs"></div>
      <h3>Trajectory viewer</h3>
      <div class="traj-launcher" id="nav-trajs"></div>
      <h3>Files</h3>
      <div class="file-tree" id="nav-files"></div>
    </nav>

    <section class="viewer glass" id="viewer">
      <div class="viewer-head">
        <button class="back-btn" id="back-btn" title="back" hidden>‹</button>
        <span class="title" id="viewer-title"></span>
      </div>
      <div class="traj-toolbar" id="traj-toolbar" hidden>
        <div class="traj-tabs" id="traj-tabs"></div>
        <button class="quiet" id="collapse-all">Collapse all</button>
      </div>
      <div id="viewer-body"></div>
    </section>

    <div class="panel-resizer" id="chat-resizer" title="Drag to resize · double-click to hide"><span></span></div>

    <aside class="chat-panel glass" id="chat-panel">
      <div class="chat-head">
        <span class="title">Audit copilot</span>
        <button id="clear-chat">clear</button>
        <button id="collapse-chat" title="hide the copilot panel (or double-click the divider)">Hide</button>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div class="status-line" id="chat-status"></div>
      <div class="chat-input">
        <textarea id="chat-text" placeholder="Ask about this task… (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="primary" id="chat-send">Send</button>
      </div>
    </aside>
  </div>

  <button class="chat-fab glass" id="expand-chat" hidden>Copilot ⟨</button>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script type="module" src="/js/task.js"></script>
</body>
</html>
