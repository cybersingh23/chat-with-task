<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task — Chat with Task</title>
  <link rel="stylesheet" href="/css/studio.css" />
  <link rel="icon" href="/scale-icon.svg" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="back-home" title="back to board">‹ Board</a>
    <button class="sev-badge-btn" id="sev-chip" title="reclassify severity"></button>
    <span class="mono task-id" id="task-id"></span>
    <div class="spacer"></div>

    <span class="claim-who" id="claim-who"></span>
    <button id="claim-btn"></button>

    <select class="verdict-select" id="verdict-select" title="set your decision">
      <option value="">Set decision…</option>
      <option value="NO_ISSUES">No Issues</option>
      <option value="FIXES_MADE">Fixes made</option>
      <option value="GRAMMAR_ONLY">Grammar-only</option>
      <option value="SBQ">SBQ</option>
      <option value="SECOND_OPINION">Second Opinion Needed</option>
    </select>

    <div class="divider"></div>

    <button class="tour-btn" id="tour-btn" title="guided walkthrough">✦ Tour</button>
    <button class="danger" id="delete-task" hidden>Delete</button>

    <div class="divider"></div>

    <div class="user-chip" id="user-chip" hidden>
      <span class="avatar sm" id="user-avatar"></span>
      <span id="user-name"></span>
      <button id="logout-btn" title="sign out">Sign out</button>
    </div>
  </header>

  <div class="task-layout">
    <nav class="sidebar glass" id="sidebar">
      <h3>Documents</h3>
      <div id="nav-docs"></div>
      <h3>Trajectory viewer</h3>
      <div class="traj-launcher" id="nav-trajs"></div>
      <h3>Files</h3>
      <div class="file-tree" id="nav-files"></div>
    </nav>

    <section class="viewer glass" id="viewer">
      <div class="viewer-head">
        <button class="back-btn" id="back-btn" title="back" hidden>‹</button>
        <span class="title" id="viewer-title"></span>
      </div>
      <div class="traj-toolbar" id="traj-toolbar" hidden>
        <div class="traj-tabs" id="traj-tabs"></div>
        <button class="quiet" id="collapse-all">Collapse all</button>
      </div>
      <div id="viewer-body"></div>
    </section>

    <div class="panel-resizer" id="chat-resizer" title="Drag to resize · double-click to hide"><span></span></div>

    <aside class="chat-panel glass" id="chat-panel">
      <div class="chat-head">
        <img class="copilot-avatar" src="/copilot.png" alt="" />
        <span class="title">Acey</span>
        <div class="mode-toggle" id="copilot-mode" role="group" aria-label="Copilot mode" title="Static = written answer with citation chips. Dynamic = a clickable, step-by-step guided walkthrough of the evidence.">
          <button type="button" data-mode="static" class="active">Static</button>
          <button type="button" data-mode="dynamic">Dynamic</button>
        </div>
        <button id="clear-chat">clear</button>
        <button id="collapse-chat" title="hide Acey (or double-click the divider)">Hide</button>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div class="status-line" id="chat-status"></div>
      <div class="chat-input">
        <textarea id="chat-text" placeholder="Ask Acey about this task… (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="primary" id="chat-send">Send</button>
      </div>
    </aside>
  </div>

  <button class="chat-fab glass" id="expand-chat" hidden aria-label="Ask Acey" title="Ask Acey">
    <img class="fab-avatar" src="/copilot.png" alt="" />
  </button>
  <div class="fab-nudge glass" id="fab-nudge" hidden>
    <button class="fab-nudge-x" id="fab-nudge-x" title="dismiss" aria-label="dismiss">✕</button>
    <span>Stuck on this audit? <b>Ask Acey</b> — I’ll walk you through it →</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script type="module" src="/js/task.js"></script>
</body>
</html>
