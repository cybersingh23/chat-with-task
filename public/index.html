<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat with Task — ACC Audit Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Host+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/studio.css" />
  <link rel="icon" href="/scale-icon.svg" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="/scale-logo.svg" alt="Scale" />
    <div class="app-name">Chat with Task <span>/ ACC Audit Studio</span></div>
    <div class="spacer"></div>
    <div class="meta" id="config-meta"></div>
  </header>

  <main class="index-main">
    <section class="ingest">
      <div class="drop-zone" id="drop-zone">
        <div class="drop-title">Add a task to audit</div>
        <div class="drop-sub">Drag the <span class="mono">&lt;task_id&gt;</span> folder (or a .zip of it) here</div>
        <div class="drop-actions">
          <button class="primary" id="pick-folder">Select folder…</button>
          <button id="pick-zip">Select .zip…</button>
          <select id="upload-bucket" title="bucket for the new task">
            <option value="UNSORTED">→ UNSORTED</option>
            <option value="HARD_FAIL">→ HARD_FAIL</option>
            <option value="SOFT_FAIL">→ SOFT_FAIL</option>
            <option value="PASS">→ PASS</option>
          </select>
        </div>
        <div class="progress" id="upload-progress" hidden>
          <div class="progress-bar" id="upload-bar"></div>
        </div>
        <div class="mono drop-status" id="upload-status"></div>
        <input type="file" id="folder-input" webkitdirectory multiple hidden />
        <input type="file" id="zip-input" accept=".zip" hidden />
      </div>
      <details class="claim-secondary">
        <summary>…or claim by task ID (server-side search of local delivery folders)</summary>
        <div class="claim-row">
          <input type="text" id="claim-input" placeholder="full 24-char task_id" maxlength="24" spellcheck="false" />
          <button id="claim-btn">Claim</button>
          <span class="mono" id="claim-status"></span>
        </div>
      </details>
    </section>

    <div class="buckets" id="buckets"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script type="module" src="/js/index.js"></script>
</body>
</html>
