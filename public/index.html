<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat with Task — ACC Audit Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Host+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/studio.css" />
  <link rel="icon" href="/scale-icon.svg" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="/scale-logo.svg" alt="Scale" />
    <div class="app-name">Chat with Task <span>/ ACC Audit Studio</span></div>
    <div class="spacer"></div>
    <div class="meta" id="config-meta"></div>
  </header>

  <main class="index-main">
    <div class="claim-box">
      <input type="text" id="claim-input" placeholder="paste full 24-char task_id to claim" maxlength="24" spellcheck="false" />
      <select id="claim-bucket">
        <option value="UNSORTED">UNSORTED</option>
        <option value="HARD_FAIL">HARD_FAIL</option>
        <option value="SOFT_FAIL">SOFT_FAIL</option>
        <option value="PASS">PASS</option>
      </select>
      <button class="primary" id="claim-btn">Claim task</button>
      <span class="mono" id="claim-status"></span>
      <div class="hint">
        Claims search every ACC_DELIVERY_* folder under the configured delivery roots and copy the
        task (plus its _audit findings as a seed) into the workspace. Bulk-sort an audited delivery
        with <code>python3 tools/sort_delivery.py &lt;delivery_dir&gt;</code>.
      </div>
    </div>
    <div class="buckets" id="buckets"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script type="module">
    import { api, el } from '/js/common.js';

    const ORDER = ['HARD_FAIL', 'SOFT_FAIL', 'PASS', 'UNSORTED'];

    async function load() {
      const [ws, cfg] = await Promise.all([api('/workspace'), api('/config')]);
      document.getElementById('config-meta').textContent = `${cfg.model} · ${cfg.workspaceRoot}`;
      const root = document.getElementById('buckets');
      root.replaceChildren();
      for (const bucket of ORDER) {
        const tasks = ws[bucket] || [];
        root.append(
          el('section', { class: 'bucket' },
            el('h2', {}, el('span', { class: `chip ${bucket}` }, bucket), el('span', { class: 'count' }, String(tasks.length))),
            tasks.map((t) =>
              el('a', { class: 'task-card', href: `/task/${bucket}/${t.id}` },
                el('div', { class: 'tid' }, t.id),
                t.problem ? el('div', { class: 'prob' }, t.problem) : null,
                el('div', { class: 'dots' },
                  el('span', { class: `dot ${t.hasReview ? 'on' : ''}` }, '● review'),
                  el('span', { class: `dot ${t.hasRemediation ? 'on' : ''}` }, '● remediation'),
                  el('span', { class: `dot ${t.hasAuditSeed ? 'on' : ''}` }, '● seed'),
                ),
              )
            ),
          )
        );
      }
    }

    document.getElementById('claim-btn').addEventListener('click', async () => {
      const status = document.getElementById('claim-status');
      const taskId = document.getElementById('claim-input').value.trim();
      const bucket = document.getElementById('claim-bucket').value;
      status.textContent = 'searching…';
      try {
        const r = await api('/ingest', { method: 'POST', body: { taskId, bucket } });
        status.textContent = `claimed from ${r.source}`;
        location.href = `/task/${r.bucket}/${r.taskId}`;
      } catch (e) {
        status.textContent = e.message;
      }
    });

    load();
  </script>
</body>
</html>
